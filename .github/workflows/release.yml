name: Релиз

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: ffmpeg для самопроверки
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Самопроверка
        run: |
          set -e
          BASE=$(date +%s)
          ffmpeg -y -loglevel error -f lavfi -i "testsrc=duration=300:size=320x240:rate=10" -f lavfi -i "sine=frequency=440:duration=300" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac /tmp/day.mp4
          printf '{"ts":%d,"type":"kill","player":"Torpedo","other":"Banderas"}\n{"ts":%d,"type":"wreck","player":"Banderas"}\n{"ts":%d,"type":"arrest","player":"CopMike","other":"Robber"}\n{"ts":%d,"type":"rob","player":"Shadow","other":"Bank"}\n' \
            $((BASE+30)) $((BASE+34)) $((BASE+150)) $((BASE+260)) > /tmp/rpreel.jsonl
          go build -o /tmp/rp-reel-cli ./cmd/rp-reel-cli
          /tmp/rp-reel-cli -log /tmp/rpreel.jsonl -video /tmp/day.mp4 -video-ts $BASE -out /tmp/selftest-out
          test -f /tmp/selftest-out/reel.mp4 && echo "самопроверка: ролик готов"

      - name: Сборка GUI для Windows
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: go build -ldflags "-H=windowsgui -s -w -X main.version=${GITHUB_REF_NAME#v}" -o rp-reel.exe ./cmd/rp-reel

      - name: Сборка CLI для Windows
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o rp-reel-cli.exe ./cmd/rp-reel-cli

      - name: Архив
        run: |
          mkdir -p staging
          cp rp-reel.exe rp-reel-cli.exe staging/
          cp README.md README.en.md LICENSE CHANGELOG.md КАК-ЗАПУСТИТЬ.txt staging/
          cp -r plugins staging/plugins
          mkdir -p staging/templates
          cp internal/template/presets/README.md staging/templates/
          cd staging && zip -qr ../rp-reel-windows.zip . && cd ..
          sha256sum rp-reel-windows.zip | awk '{print $1}' > rp-reel-windows.zip.sha256

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            rp-reel-windows.zip
            rp-reel-windows.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
